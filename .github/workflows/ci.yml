name: CI

# Static checks and the default test suite. Nothing here needs root, hardware,
# dmidecode, decode-dimms, or stress-ng: tests inject detection, jobs, and an
# isolated MEM_STATION_STATE_DIR. Every step is a Makefile target so local runs
# and CI cannot drift apart.
on:
  push:
    branches: [main, tui-improvements]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt (fails on unformatted files), vet, build, and the default tests.
      # Golden drift fails here too: comparison runs unless -update/the update
      # env var is set, which CI never sets.
      - name: make check
        run: make check

      - name: make race
        run: make race

      # Compiles the tagged runner tests and runs them against /bin/sh.
      - name: make integration
        run: make integration
